x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}
    compress: ${LOG_COMPRESS:-true}
services:
  open-webui:
    image: ${IMAGE:-ghcr.io/open-webui/open-webui:main}
    container_name: ${PROJECT_NAME:-open-webui}
    restart: unless-stopped
    volumes:
      - open-webui:/app/backend/data
    logging: *default-logging
    environment:
      DEFAULT_MODELS: ${DEFAULT_MODELS:-}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      ENABLE_OPENAI_API: ${ENABLE_OPENAI_API:-true}
      ENABLE_OLLAMA_API: ${ENABLE_OLLAMA_API:-false}
      ENABLE_EVALUATION_ARENA_MODELS: ${ENABLE_EVALUATION_ARENA_MODELS:-false}
      OFFLINE_MODE: ${OFFLINE_MODE:-false}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-}
      CHAT_STREAM_SPLIT_LARGE_CONTENT: ${CHAT_STREAM_SPLIT_LARGE_CONTENT:-true}
      CHAT_STREAM_RESPONSE_CHUNK_MAX_BUFFER_SIZE: ${CHAT_STREAM_RESPONSE_CHUNK_MAX_BUFFER_SIZE:-10485760}
      VIRTUAL_PORT: ${VIRTUAL_PORT}
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URLS: ${OPENAI_API_BASE_URLS:-}
      OPENAI_API_KEYS: ${OPENAI_API_KEYS:-}
      TASK_MODEL_EXTERNAL: ${TASK_MODEL_EXTERNAL}
      ENABLE_OAUTH_SIGNUP: ${ENABLE_OAUTH_SIGNUP}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OPENID_PROVIDER_URL: ${OPENID_PROVIDER_URL}
      OAUTH_PROVIDER_NAME: ${OAUTH_PROVIDER_NAME}
      OPENID_REDIRECT_URI: ${OPENID_REDIRECT_URI}
      OAUTH_GROUPS_CLAIM: ${OAUTH_GROUPS_CLAIM}
      STEP_CA_TRUST: ${STEP_CA_TRUST:-true}
      STEP_CA_TRUST_RESTART: ${STEP_CA_TRUST_RESTART:-true}
      REQUESTS_CA_BUNDLE: ${REQUESTS_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}
    networks:
      - open-webui-network
      - step-ca-network
volumes:
  open-webui:
    name: ${PROJECT_NAME:-open-webui}
networks:
  open-webui-network:
    name: ${PROJECT_NAME:-open-webui}-network
  step-ca-network:
    external: true
